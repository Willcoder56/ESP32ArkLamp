esphome:
  name: arc-lamp
  friendly_name: Arc Lamp

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

logger:

api:

ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Falls back to its own hotspot if it can't find configured wifi
  # (e.g. at college) - lamp still runs fully standalone either way.
  ap:
    ssid: "ArcLamp Fallback"
    password: "12345678"

captive_portal:

i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true

uart:
  id: ld2410_uart
  tx_pin: GPIO18
  rx_pin: GPIO17
  baud_rate: 256000

# --- WS2815 arc strip ---
light:
  - platform: esp32_rmt_led_strip
    id: arc_light
    name: "Arc Lamp"
    pin: GPIO4
    num_leds: 105
    rmt_channel: 0
    chipset: WS2812   # WS2815 uses the same data protocol/timing
    rgb_order: GRB
    default_transition_length: 300ms
    effects:
      - addressable_rainbow:
      - addressable_color_wipe:
      - pulse:

# --- LD2410B presence radar ---
ld2410:
  id: ld2410_radar

# --- MPR121 capacitive touch ---
mpr121:
  id: touch_pads
  address: 0x5A

binary_sensor:
  # Presence -> auto on/off, brightness scaled to how dark the room already is
  - platform: ld2410
    has_target:
      name: "Presence"
      id: presence_sensor
      on_press:
        then:
          - light.turn_on:
              id: arc_light
              # Darker room -> lamp comes up brighter. Bright room -> lamp
              # barely has to try. Nobody wants to get blinded at 2pm.
              brightness: !lambda |-
                float lux = id(ambient_lux).state;
                if (isnan(lux)) return 0.6;
                float b = 1.0 - (lux / 500.0);
                if (b < 0.15) b = 0.15;
                if (b > 1.0) b = 1.0;
                return b;
      on_release:
        then:
          - light.turn_off: arc_light

  # Touch pads -> 5 brightness presets
  - platform: mpr121
    channel: 0
    name: "Touch Pad 1"
    on_press:
      then:
        - light.turn_on:
            id: arc_light
            brightness: 20%
  - platform: mpr121
    channel: 1
    name: "Touch Pad 2"
    on_press:
      then:
        - light.turn_on:
            id: arc_light
            brightness: 40%
  - platform: mpr121
    channel: 2
    name: "Touch Pad 3"
    on_press:
      then:
        - light.turn_on:
            id: arc_light
            brightness: 60%
  - platform: mpr121
    channel: 3
    name: "Touch Pad 4"
    on_press:
      then:
        - light.turn_on:
            id: arc_light
            brightness: 80%
  - platform: mpr121
    channel: 4
    name: "Touch Pad 5"
    on_press:
      then:
        - light.turn_on:
            id: arc_light
            brightness: 100%

# --- BH1750 ambient light sensor (shares the I2C bus above) + LD2410 ranges ---
sensor:
  - platform: bh1750
    name: "Ambient Light"
    id: ambient_lux
    address: 0x23
    update_interval: 30s

  - platform: ld2410
    moving_distance:
      name: "Moving Distance"
    still_distance:
      name: "Still Distance"
    detection_distance:
      name: "Detection Distance"
